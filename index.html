<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project 2.5 Sketch Planning Verification - Walton Engineering</title>
  <link rel="icon" type="image/png" href="WalEngLogoNoBGRed.png">
  <link rel="apple-touch-icon" href="WalEngLogoNoBGRed.png">
  <style>
    :root {
      --walton-blue: #0B4EA2;
      --walton-blue-dark: #073570;
      --walton-blue-light: #eaf1fb;
      --walton-red: #C8102E;
      --success-green: #2e7d32;
      --success-bg: #edf7ed;
      --error-red: #d32f2f;
      --error-bg: #fdeded;
      --neutral-border: #d0d7de;
      --neutral-bg: #f8fafc;
      --text-dark: #1f2937;
      --text-muted: #57606a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f5f9;
      color: var(--text-dark);
      padding: 24px 16px;
      line-height: 1.45;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #ffffff;
      border: 1px solid var(--neutral-border);
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    /* Header styling */
    .header {
      background: linear-gradient(135deg, var(--walton-blue-dark) 0%, var(--walton-blue) 100%);
      color: #ffffff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 18px;
      border-bottom: 4px solid var(--walton-red);
    }

    .header-logo {
      height: 52px;
      width: auto;
      max-width: 70px;
      object-fit: contain;
      flex-shrink: 0;
      display: block;
    }

    .header-text h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.2px;
    }

    .header-text p {
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 2px;
    }

    .content {
      padding: 20px 24px;
    }

    /* Student metadata bar */
    .student-info-bar {
      display: grid;
      grid-template-columns: 2fr 1fr 1.2fr;
      gap: 14px;
      background: var(--neutral-bg);
      border: 1px solid var(--neutral-border);
      border-radius: 6px;
      padding: 12px 16px;
      margin-bottom: 16px;
      align-items: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .form-group input, 
    .form-group select {
      padding: 7px 10px;
      border: 1px solid var(--neutral-border);
      border-radius: 4px;
      font-size: 13px;
      background: white;
      color: var(--text-dark);
    }

    .form-group input.easter-egg-alert {
      border: 2px solid var(--walton-red);
      background-color: #fff1f2;
      color: #991b1b;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(200, 16, 46, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(200, 16, 46, 0); }
      100% { box-shadow: 0 0 0 0 rgba(200, 16, 46, 0); }
    }

    .track-badge-container {
      display: none;
    }

    /* Status banner */
    .status-banner {
      padding: 12px 16px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-banner.valid {
      background: var(--success-bg);
      border: 1.5px solid var(--success-green);
      color: #1b5e20;
    }

    .status-banner.invalid {
      background: var(--error-bg);
      border: 1.5px solid var(--error-red);
      color: #b71c1c;
    }

    .status-icon {
      font-size: 24px;
      line-height: 1;
      font-weight: 900;
    }

    .status-title {
      font-size: 14.5px;
      font-weight: 700;
    }

    .status-subtitle {
      font-size: 12px;
      opacity: 0.9;
    }

    /* Diagnostics panel */
    .diagnostic-panel {
      display: none;
      margin-bottom: 18px;
      background: #fff;
      border: 1px solid #fecaca;
      border-radius: 6px;
      overflow: hidden;
    }

    .diagnostic-panel.visible {
      display: block;
    }

    .diagnostic-header {
      background: #fee2e2;
      color: #991b1b;
      font-size: 12px;
      font-weight: 700;
      padding: 7px 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .diagnostic-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      font-size: 12.5px;
    }

    .diagnostic-col {
      padding: 10px 14px;
    }

    .diagnostic-col:first-child {
      border-right: 1px solid #fee2e2;
      background: #fffafa;
    }

    .diagnostic-col h4 {
      font-size: 11.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-weight: 700;
    }
