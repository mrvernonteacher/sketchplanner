<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft shadow for dimension -->
    <filter id="drop-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000000" flood-opacity="0.3"/>
    </filter>

    <!-- Master Walton Concave Diamond Geometry -->
    <path id="walton-diamond" d="M 256, 20 
             C 295, 145 367, 217 492, 256 
             C 367, 295 295, 367 256, 492 
             C 217, 367 145, 295 20, 256 
             C 145, 217 217, 145 256, 20 Z" />

    <!-- Left & Right Split Clips (Divided down x=256) -->
    <clipPath id="clip-left">
      <rect x="0" y="0" width="256" height="512" />
    </clipPath>
    <clipPath id="clip-right">
      <rect x="256" y="0" width="256" height="512" />
    </clipPath>

    <!-- Graphite Shading Hatch Patterns for the Sketched Side -->
    <pattern id="graphite-hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#334155" stroke-width="1.8" opacity="0.75"/>
    </pattern>

    <pattern id="dense-crosshatch" width="6" height="6" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#475569" stroke-width="1.2" opacity="0.45"/>
    </pattern>

    <pattern id="drafting-grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#94A3B8" stroke-width="0.75" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- =======================================================
       LAYER 1: DRAFTING PENCIL (ROTATED 45° IN BACKGROUND)
       ======================================================= -->
  <g transform="rotate(45 256 256)" filter="url(#drop-shadow)">
    <!-- White contrast halo for dark browser tabs -->
    <path d="M 224, 450 L 224, 98 L 256, -16 L 288, 98 L 288, 450 Z" 
          stroke="#FFFFFF" stroke-width="10" stroke-linejoin="round" fill="none" />

    <!-- Eraser -->
    <rect x="228" y="450" width="56" height="58" rx="14" fill="#E11D48" />
    <path d="M 228, 470 Q 256, 476 284, 470" stroke="#BE123C" stroke-width="3" fill="none" opacity="0.6"/>

    <!-- Ferrule (Metal Collar) -->
    <rect x="226" y="415" width="60" height="38" rx="2" fill="#94A3B8" />
    <line x1="226" y1="424" x2="286" y2="424" stroke="#E2E8F0" stroke-width="2" />
    <line x1="226" y1="432" x2="286" y2="432" stroke="#475569" stroke-width="2" />
    <line x1="226" y1="440" x2="286" y2="440" stroke="#CBD5E1" stroke-width="2" />

    <!-- Pencil Hexagonal Barrel -->
    <rect x="228" y="98" width="18" height="317" fill="#D97706" />
    <rect x="246" y="98" width="20" height="317" fill="#F59E0B" />
    <rect x="266" y="98" width="18" height="317" fill="#FDE047" />

    <!-- Sharpened Wood Cone & Lead Tip -->
    <polygon points="228,98 256,-10 284,98" fill="#FDE68A" />
    <polygon points="246,98 256,-10 284,98" fill="#FEF08A" opacity="0.6" />
    <polygon points="247,38 256,-10 265,38" fill="#0F172A" />
  </g>

  <!-- =======================================================
       LAYER 2: RIGHT HALF — FINISHED OFFICIAL LOGO
       ======================================================= -->
  <g clip-path="url(#clip-right)" filter="url(#drop-shadow)">
    <!-- Red Outer Star -->
    <use href="#walton-diamond" fill="#C8102E" />

    <!-- White Boundary Stripe -->
    <use href="#walton-diamond" transform="translate(256 256) scale(0.90) translate(-256 -256)" fill="#FFFFFF" />

    <!-- Royal Blue Star Field -->
    <use href="#walton-diamond" transform="translate(256 256) scale(0.82) translate(-256 -256)" fill="#0B4EA2" />

    <!-- Crisp White Block 'W' (Right Half) -->
    <polygon points="
      191, 212
      222, 212
      240, 288
      248, 234
      264, 234
      272, 288
      290, 212
      321, 212
      296, 326
      268, 326
      256, 274
      244, 326
      216, 326"
      fill="#FFFFFF" />
  </g>

  <!-- =======================================================
       LAYER 3: LEFT HALF — PENCIL SKETCHED & DRAFTED LOGO
       ======================================================= -->
  <g clip-path="url(#clip-left)" filter="url(#drop-shadow)">
    <!-- Subtle drafting paper background behind the sketch -->
    <use href="#walton-diamond" fill="#F8FAFC" />
    <use href="#walton-diamond" fill="url(#drafting-grid)" />

    <!-- Sketched Outer Red Boundary (Graphite layout passes) -->
    <use href="#walton-diamond" fill="none" stroke="#64748B" stroke-width="4.5" stroke-dasharray="8 3" opacity="0.65" />
    <use href="#walton-diamond" fill="none" stroke="#1E293B" stroke-width="2.5" />
    <use href="#walton-diamond" transform="translate(256 256) scale(0.99) translate(-256 -256)" 
         fill="none" stroke="#475569" stroke-width="1.2" opacity="0.8" />

    <!-- Sketched Inset Band (Graphite Lines) -->
    <use href="#walton-diamond" transform="translate(256 256) scale(0.90) translate(-256 -256)" 
         fill="none" stroke="#94A3B8" stroke-width="2" stroke-dasharray="5 2" />

    <!-- Sketched Blue Field (Shaded with Graphite Hatching & Crosshatching) -->
    <use href="#walton-diamond" transform="translate(256 256) scale(0.82) translate(-256 -256)" fill="#E2E8F0" />
    <use href="#walton-diamond" transform="translate(256 256) scale(0.82) translate(-256 -256)" fill="url(#graphite-hatch)" />
    <use href="#walton-diamond" transform="translate(256 256) scale(0.82) translate(-256 -256)" fill="url(#dense-crosshatch)" />
    
    <!-- Multi-stroke Graphite Contours for Field -->
    <use href="#walton-diamond" transform="translate(256 256) scale(0.82) translate(-256 -256)" 
         fill="none" stroke="#0F172A" stroke-width="2.5" />
    <use href="#walton-diamond" transform="translate(256 256) scale(0.815) translate(-256 -256)" 
         fill="none" stroke="#475569" stroke-width="1.2" opacity="0.75" />

    <!-- Sketched 'W' (Left Half): White Body with Graphite Pencil Outline and Crosshatching -->
    <polygon points="
      191, 212
      222, 212
      240, 288
      248, 234
      264, 234
      272, 288
      290, 212
      321, 212
      296, 326
      268, 326
      256, 274
      244, 326
      216, 326"
      fill="#FFFFFF" 
      stroke="#1E293B" 
      stroke-width="3" 
      stroke-linejoin="round" />

    <polygon points="
      191, 212
      222, 212
      240, 288
      248, 234
      264, 234
      272, 288
      290, 212
      321, 212
      296, 326
      268, 326
      256, 274
      244, 326
      216, 326"
      fill="url(#dense-crosshatch)" opacity="0.4" />

    <!-- Draftsman's Rough Second Contour Stroke on 'W' -->
    <path d="M 190, 211 L 221, 211 L 239, 289 L 247, 235 L 256, 235 L 256, 274 L 244, 327 L 215, 327 Z" 
          fill="none" stroke="#64748B" stroke-width="1.2" stroke-dasharray="6 2" opacity="0.8" />

    <!-- Engineering Drafting Node Points (Circles on key vertices) -->
    <circle cx="191" cy="212" r="3" fill="#0F172A" />
    <circle cx="222" cy="212" r="3" fill="#0F172A" />
    <circle cx="240" cy="288" r="3" fill="#0F172A" />
    <circle cx="216" cy="326" r="3" fill="#0F172A" />
    <circle cx="244" cy="326" r="3" fill="#0F172A" />
    <circle cx="20"  cy="256" r="3" fill="#0F172A" />

    <!-- Draftsman Construction Guidelines (Overshoots extending into space) -->
    <line x1="5"   y1="256" x2="60"  y2="256" stroke="#64748B" stroke-width="1" stroke-dasharray="4 3" />
    <line x1="256" y1="5"   x2="256" y2="50"  stroke="#64748B" stroke-width="1" stroke-dasharray="4 3" />
    <line x1="256" y1="465" x2="256" y2="505" stroke="#64748B" stroke-width="1" stroke-dasharray="4 3" />
    <line x1="180" y1="212" x2="235" y2="212" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="3 2" />
    <line x1="205" y1="326" x2="256" y2="326" stroke="#94A3B8" stroke-width="0.8" stroke-dasharray="3 2" />
  </g>

  <!-- =======================================================
       LAYER 4: CENTERLINE DIVIDER (TRANSITION BOUNDARY)
       ======================================================= -->
  <!-- Classic Engineering Centerline (Long dash - dot - long dash) -->
  <line x1="256" y1="12" x2="256" y2="500" 
        stroke="#0F172A" stroke-width="2.5" stroke-dasharray="16 4 3 4" opacity="0.85" />
</svg>
